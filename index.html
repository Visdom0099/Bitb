<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131211">
<meta name="description" content="A minimal team to-do list: a private list for you and shared lists for your team.">
<title>BITB List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#131211; --surface:#1c1a18; --raise:#24221f; --line:#2e2b27;
  --fg:#ece7de; --muted:#938c80; --accent:#d4a35a; --accent-ink:#1b1408; --danger:#e57a62;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f5f2ec; --surface:#fff; --raise:#efebe3; --line:#e0dacf;
  --fg:#1e1b17; --muted:#6e675c; --accent:#9a6a24; --accent-ink:#fff; --danger:#b4462d; color-scheme:light }}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hleft{justify-self:start;min-width:0}
.brand{justify-self:center;text-align:center}
.brand h1{font:700 44px/1 var(--display);letter-spacing:-.03em;margin:0;white-space:nowrap}
header .me{justify-self:end;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;min-width:0}
@media (max-width:620px){header{grid-template-columns:1fr auto}.brand{grid-column:1/-1;grid-row:1}.hleft{grid-row:2}.me{grid-row:2}}
.me .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.av{width:26px;height:26px;border-radius:50%;flex:none;object-fit:cover;background:var(--raise);display:inline-grid;place-items:center;font:600 11px/1 var(--body);color:var(--muted)}
.av.sm{width:20px;height:20px;font-size:9px}
.stack{display:flex}
.stack .av{border:2px solid var(--bg);margin-left:-7px}
.stack .av:first-child{margin-left:0}

.rail{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500;max-width:100%}
.chip .n{font:500 11px/1 var(--mono);color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.on .n{color:inherit;opacity:.65}
.chip.add{border-style:dashed;color:var(--muted)}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:13px;height:13px;flex:none}

.row{display:flex;gap:8px}
.field{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;outline:none}
.field:focus{border-color:var(--accent)}
.field::placeholder{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:0 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.btn.big{padding:13px 20px;display:inline-flex;align-items:center;gap:10px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--muted)}
.ghost.danger{color:var(--danger)}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--fg)}

.panel{display:flex;flex-direction:column;gap:16px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.phead h2{font:700 24px/1.15 var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.sub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;gap:6px;flex-wrap:wrap}

.meter{display:flex;align-items:center;gap:12px;font:500 12px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.task{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.check{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--muted);background:none;display:grid;place-items:center;padding:0}
.check svg{width:13px;height:13px;opacity:0}
.task.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task.done .check svg{opacity:1}
.ttext{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .ttext{color:var(--muted);text-decoration:line-through}
.del{background:none;border:0;color:var(--muted);padding:4px;opacity:0;border-radius:6px;display:grid;place-items:center}
.task:hover .del,.del:focus-visible{opacity:1}
@media (hover:none){.del{opacity:.6}}
.del:hover{color:var(--danger)}

.empty{padding:36px 8px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--fg);font:600 16px/1.3 var(--display);margin-bottom:4px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.person{display:flex;align-items:center;gap:10px;padding:6px 4px}
.person .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .em{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis}
.tag{font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.04em}
.hint{color:var(--muted);font-size:13px;margin:0}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}

.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.gate h2{font:700 40px/1.05 var(--display);letter-spacing:-.03em;margin:0;max-width:14ch}
.gate p{color:var(--muted);margin:0;max-width:46ch}
.notice{padding:12px 14px;border-radius:10px;background:var(--raise);color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.namebtn{background:none;border:0;padding:0;color:var(--fg);font-size:13px;font-weight:500;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namebtn:hover{text-decoration:underline;text-underline-offset:3px}
#addTask{flex-wrap:wrap}
#addTask .field{flex:1 1 200px}
.sel{flex:0 1 auto!important;min-width:0;max-width:100%;padding-right:10px;cursor:pointer}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:none;font-size:13px;color:var(--muted);max-width:100%}
.fchip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip .n{font:500 11px/1 var(--mono);font-variant-numeric:tabular-nums}
.fchip.on{border-color:var(--accent);color:var(--fg);background:var(--raise)}
.group{display:flex;align-items:center;gap:8px;padding:16px 2px 6px;border-bottom:1px solid var(--line);font:600 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.group .n{font:500 11px/1 var(--mono);letter-spacing:0;text-transform:none}
.group.me{color:var(--accent)}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.forme{font:500 10px/1 var(--mono);letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);padding:4px 6px;border-radius:5px;flex:none}
.task.locked .check{opacity:.35;cursor:not-allowed}
.task.others .ttext{color:var(--muted)}
/* Bigger interface on the full page */
body{font-size:17px}
.wrap{max-width:780px;gap:26px;padding-block:40px 80px}
.chip{font-size:17px;padding:10px 18px;gap:9px}
.chip .n{font-size:12px}
.ico{width:15px;height:15px}
.phead h2{font-size:38px}
.sub{font-size:14px}
.field{padding:14px 16px}
.btn{padding:0 22px}
.task{padding:15px 2px;gap:14px}
.check{width:24px;height:24px}
.meta{font-size:13px}
.fchip{font-size:14px;padding:7px 12px}
.ghost{font-size:14px;padding:7px 13px}
.group{font-size:13px}
.av{width:30px;height:30px}
.namebtn{font-size:15px}
.floatbtn{display:inline-flex;align-items:center;gap:7px}
.floatbtn svg{width:15px;height:15px}

#addTask .btn{padding-block:12px}
@media (max-width:520px){#addTask .field:not(.sel){flex-basis:100%}#addTask .sel{flex:1 1 auto!important}}
/* Compact mini window (opened with ?mini) */
body.mini{font-size:15px}
body.mini .wrap{max-width:none;gap:16px;padding-block:14px 24px}
body.mini header{grid-template-columns:1fr auto 1fr}
body.mini .brand{grid-column:2;grid-row:1}
body.mini .hleft{grid-column:3;grid-row:1;justify-self:end}
body.mini header .me,body.mini .phead,body.mini .meter,body.mini #empty,body.mini #foot,body.mini #peopleSheet,body.mini #confirm{display:none!important}
body.mini .brand h1{font-size:28px}
body.mini .chip{font-size:15px;padding:7px 13px}
body.mini .field{padding:11px 12px}
body.mini .task{padding:11px 2px;gap:10px}
body.mini .av{width:24px;height:24px}
body.mini .gate{min-height:0;padding-block:20px}
body.
