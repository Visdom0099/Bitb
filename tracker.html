a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:clamp(22px,3.4vw,36px);font-weight:700;text-align:center;margin:8px 0 22px;letter-spacing:-.01em}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs>div{padding:18px 12px 20px;text-align:center;background:var(--tab);border-left:1px solid var(--border);cursor:pointer;position:relative;transition:background .15s}
.tabs>div:first-child{border-left:0}.tabs>div:hover{background:#2a2a2a}
.tabs>div.sel{background:var(--panel)}.tabs>div.sel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.lab{color:var(--muted);font-size:15px}.val{font-size:clamp(24px,3vw,38px);font-weight:700;margin:4px 0 2px;display:flex;justify-content:center;align-items:center;gap:10px}
.sub{color:var(--muted);font-style:italic;font-size:14px}
.badge{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;color:#fff}
@media (max-width:760px){.tabs{grid-template-columns:1fr 1fr}.tabs>div:nth-child(3){border-left:0}.tabs>div{border-top:1px solid var(--border)}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:16px 18px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:#2c2c2c;border-color:#777}.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button.on{background:#2c2c2c;color:var(--ink)}
.chartwrap{position:relative;padding:18px 8px 6px 16px}
.lvstats{display:none;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 18px 0}
.lvstats.on{display:grid}@media (max-width:760px){.lvstats{grid-template-columns:repeat(2,1fr)}}
.lvstats>div{background:#202020;border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.lvstats .k{color:var(--muted);font-size:12px}.lvstats .v{font-size:18px;font-weight:700;margin-top:2px}
.lvstats .bad{color:var(--down)}.lvstats .good{color:var(--up)}
#mode:empty{display:none}
.lvstats .k{background:none;border:0;padding:0}
svg{display:block;width:100%;height:auto;overflow:visible}
.tick{fill:var(--muted);font-size:13px}.rowlab{fill:var(--muted);font-size:11px}
.hit{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:#1b1b1b;border:1px solid #555;border-radius:12px;padding:10px 16px;display:none;box-shadow:0 6px 24px #0008;max-width:320px;z-index:2}
.tip .d{font-weight:500;font-size:14px}.tip .n{color:var(--accent);font-size:26px;font-weight:500}
.tip .s{color:var(--muted);font-size:12px;margin-top:2px;white-space:normal}
.tip{max-width:400px}.vh{font-weight:500;font-size:15px;margin-bottom:4px}
.vr{display:flex;gap:12px;align-items:center;margin-top:10px}
.vr img{width:76px;height:43px;object-fit:cover;border-radius:7px;flex:none;background:#333}
.vt{font-size:14px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vd{color:var(--muted);font-size:13px;margin-top:2px}
.hint{color:var(--muted);font-size:13px;text-align:center;padding:2px 0 14px}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-top:16px}
@media (max-width:860px){.row{grid-template-columns:1fr}}

.card h3{font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 6px}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.bar{height:4px;border-radius:2px;margin-top:5px;opacity:.85}
.meta{color:var(--muted);font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.lhead span:first-child{color:var(--ink);font-size:15px}

.vrow:hover{background:#242424}
.vrow img{width:88px;height:50px;object-fit:cover;border-radius:8px;flex:none;background:#2a2a2a}
.rank{width:16px;color:var(--muted);font-size:14px;text-align:center;flex:none}
.vinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.vtitle{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vsub{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.vsub i,.miss i{width:8px;height:8px;border-radius:50%;display:inline-block}

.vnum{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;flex:none;padding-left:6px}

.miss span{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}

main{max-width:1520px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1100px){.top{grid-template-columns:minmax(0,1fr)}}

// monotone cubic path through [x,y] points (no overshoot, so it hugs the data)

  document.getElementById('chTbl').innerHTML=v?Object.entries(v.channels).sort((a,b)=>b[1]-a[1]).map(([n,x])=>{
    let c='';if(p){const z=x-p.channels[n];c=` <span class="${z>=0?'up':'down'}">${z>=0?'▲':'▼'} ${fmt(Math.abs(z))}</span>`;}
    return `<tr><td><span class="dot" style="background:${col(n)}"></span>${esc(n)}<div class="bar" style="width:${v.total?Math.max(1,x/v.total*100):0}%;background:${col(n)}"></div></td><td class="r">${fmt(x)}${c}${v.subs?`<div class="meta">${signed(v.subs[n])} subs</div>`:''}</td></tr>`;}).join(''):'<tr><td class="empty">YouTube Analytics hasn\'t reported this day yet. It usually lands within 2–3 days.</td></tr>';
  const u=UPS[d]||[],missing=CH.filter(c=>!u.some(x=>x.channel===c));
  const clean=t=>t.replace(/#\S+/g,'').replace(/\s+/g,' ').trim()||t;
  const vrow=(x,rank,sub,max)=>`<a class="vrow" href="https://youtube.com/shorts/${x.id}" target="_blank" rel="noopener">
    ${rank?`<span class="rank">${rank}</span>`:''}<img src="https://i.ytimg.com/vi/${x.id}/mqdefault.jpg" alt="" loading="lazy">
    <span class="vinfo"><span class="vtitle">${esc(clean(x.title))}</span><span class="vsub"><i style="background:${col(x.channel)}"></i>${esc(x.channel)}${sub?` · ${sub}`:''}</span>
    ${max?`<span class="vbar"><b style="width:${x.views/max*100}%"></b></span>`:''}</span>
    <span class="vnum">${fmt(x.views)}</span></a>`;
  const head=(l,r)=>`<div class="lhead"><span>${l}</span><span>${r}</span></div>`;
  document.getElementById('upList').innerHTML=head(`${u.length} video${u.length===1?'':'s'} published`,'Views so far')+
    (u.length?u.map(x=>vrow(x,0,x.time)).join(''):'<div class="empty">No uploads.</div>')+
    (d<D.today&&missing.length?`<div class="miss">No upload ${missing.map(c=>`<span><i style="background:${col(c)}"></i>${esc(c)}</span>`).join('')}</div>`:'');
  const t=v&&v.top||[];
  document.getElementById('topList').innerHTML=head('Top Shorts that day','Views that day')+
    (t.length?t.map((x,k)=>vrow(x,k+1,'',t[0].views)).join(''):'<div class="empty">Not in yet.</div>');
}
// Realtime card: 48-hour views from hourly public view-count readings (yt_live.py), Studio-style
function realtime(){
  const R=D.live,el=document.getElementById('rt'),tm=t=>t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(!R){el.innerHTML='<div class="rh">Realtime</div><div class="k" style="margin-top:8px">No readings yet.</div>';return;}
  const end=new Date(R.read),ago=Math.round((Date.now()-end)/6e4),agoS=ago<60?`${Math.max(ago,0)} min ago`:ago<1440?`${Math.round(ago/60)} h ago`:`${Math.round(ago/1440)} d ago`;
  const full48=R.covered_h>=47.5,goal=D.goal_day*2,h=R.hours,mx=Math.max(1,...h.filter(v=>v!==null)),any=h.some(v=>v!==null);
  const span=R.covered_h<1?`${Math.max(1,Math.round(R.covered_h*60))} minutes`:`${R.covered_h.toFixed(1).replace(/\.0$/,'')} hours`;
  const BW=280,BH=70,bw=BW/48;
  let bars=`<svg viewBox="0 0 ${BW} ${BH}" id="rtb">`;
  const seedEnd=R.seed_until?new Date(R.seed_until):null,isSeed=k=>seedEnd&&+end-(47-k)*36e5<=+seedEnd;  // hour fully before the first reading
  h.forEach((v,k)=>{const bh=v===null?0:Math.max(v>0?1.5:0,Math.max(0,v)/mx*(BH-4));
    bars+=`<rect x="${k*bw+.6}" y="${BH-bh}" width="${bw-1.2}" height="${bh}" fill="var(--accent)" opacity="${v===null?0:.85}"/><rect class="rb" data-k="${k}" x="${k*bw}" y="0" width="${bw}" height="${BH}" fill="transparent"/>`;});
  bars+=`<line x1="0" x2="${BW}" y1="${BH}" y2="${BH}" stroke="#555"/></svg>`;
  const chs=Object.entries(R.channels).sort((a,b)=>b[1]-a[1]);
  const last60=h[47];
  el.innerHTML=`<div class="rh">Realtime</div><div class="live"><i></i>Updating hourly · read ${agoS}</div>
    <div class="sec"><div class="k">Views · ${full48?'Last 48 hours':any?`last ${span} (building up to 48 hours)`:'Last 48 hours'}</div>
      <div class="big">${any?full(R.total):'—'}</div>
      ${full48?`<div class="goal"><b style="width:${Math.min(100,R.total/goal*100)}%"></b></div><div class="k">${(R.total/goal*100).toFixed(1)}% of the ${fmt(goal)} goal</div>`:''}
      ${bars}<div class="bx"><span>48h ago</span><span>Now</span></div><div class="bt" id="rtt"></div></div>
    <div class="sec"><div class="k">Views · Last 60 minutes</div><div class="big" style="font-size:24px">${last60===null?'—':full(last60)}</div></div>
    <div class="sec"><div class="k" style="margin-bottom:4px">By channel</div>${chs.map(([n,v])=>`<div class="crow"><span><span class="dot" style="background:${col(n)}"></span>${esc(n)}</span><b>${any?full(v):'—'}</b></div>`).join('')}</div>
    <div class="sec"><div class="lhead"><span>Top content</span><span>Views</span></div>${R.top.length?R.top.map(x=>`<a class="vrow" href="https://youtube.com/shorts/${x.id}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${x.id}/mqdefault.jpg" alt="" loading="lazy"><span class="vinfo"><span class="vtitle">${esc(x.title.replace(/#\S+/g,'').trim()||x.title)}</span><span class="vsub"><i style="background:${col(x.channel)}"></i>${esc(x.channel)}</span></span><span class="vnum">${fmt(x.views)}</span></a>`).join(''):'<div class="empty">After the next reading.</div>'}</div>
    <div class="note">Added up from every video's public view count, read every hour while Jarvis's PC is on. Close to Studio's Realtime card, not identical. Last read ${tm(end)}.${seedEnd&&seedEnd>new Date(+end-48*36e5)?` Before ${tm(seedEnd)} on ${seedEnd.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} the hours are Studio's own figures; top content counts from then.`:''}</div>`;
  const tip=document.getElementById('rtt'),idle=()=>tip.textContent='';
  el.querySelectorAll('.rb').forEach(b=>b.onmouseenter=()=>{const k=+b.dataset.k,s=new Date(end-(48-k)*36e5);
    tip.textContent=h[k]===null?`${tm(s)}–${tm(new Date(+s+36e5))} · no reading yet`:`${tm(s)}–${tm(new Date(+s+36e5))} · ${full(Math.max(0,h[k]))} views${isSeed(k)?' (from Studio)':''}`;});
  document.getElementById('rtb').onmouseleave=idle;
}
realtime();
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150);});
if(D.days.length)draw();else document.getElementById('chart').innerHTML='<p class="hint">No data yet.</p>';
</script></body></html>
