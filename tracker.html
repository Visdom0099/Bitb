a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
main{max-width:1520px;margin:0 auto;padding:28px 20px 56px}
.kick{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.kick i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none}
h1{font-size:clamp(24px,3.2vw,40px);font-weight:700;text-align:center;margin:8px 0 26px;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
h1 b{font-weight:700;background:linear-gradient(90deg,#9dd6ff,#3ea6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel,.card{background:linear-gradient(180deg,#181b20,var(--panel));border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 0 #ffffff0a inset,0 18px 40px -24px #000c}
.panel{overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--tab);border-bottom:1px solid var(--border)}
.tabs>div{padding:18px 12px;text-align:center;border-left:1px solid var(--border);cursor:pointer;position:relative;transition:background .18s}
.tabs>div:first-child{border-left:0}.tabs>div:hover{background:#ffffff08}
.tabs>div.sel{background:linear-gradient(180deg,#3ea6ff1f,transparent 75%)}
.tabs>div.sel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent);box-shadow:0 0 14px #3ea6ffaa}
.tabs>div:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lab{color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase}
.tabs>div.sel .lab{color:var(--ink)}
.val{font-size:clamp(24px,2.6vw,36px);font-weight:700;letter-spacing:-.02em;margin:6px 0 4px;display:flex;justify-content:center;align-items:center;gap:9px}
.sub{color:var(--muted);font-size:12.5px}

.badge.bu{background:#3ccf6a26;color:var(--up)}.badge.bd{background:#ffffff14;color:var(--muted)}
@media (max-width:760px){.tabs{grid-template-columns:1fr 1fr}.tabs>div:nth-child(3){border-left:0}.tabs>div:nth-child(n+3){border-top:1px solid var(--border)}}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 18px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:#ffffff05;color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,color .15s}
.chip:hover{color:var(--ink);border-color:#3a3f47}
.chip.on{background:#ffffff14;border-color:#ffffff38;color:var(--ink)}.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.seg{display:flex;border:1px solid var(--border);border-radius:999px;padding:2px;background:#ffffff05}
.seg button{background:transparent;border:0;border-radius:999px;color:var(--muted);font:inherit;font-size:12.5px;font-weight:500;padding:5px 12px;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}.seg button.on{background:#ffffff1a;color:var(--ink)}
.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chartwrap{position:relative;padding:18px 8px 6px 16px}
.lvstats{display:none;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 18px 0}
.lvstats.on{display:grid}@media (max-width:760px){.lvstats{grid-template-columns:repeat(2,1fr)}}
.lvstats>div{background:#ffffff06;border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.lvstats .k{color:var(--muted);font-size:11.5px}.lvstats .v{font-size:18px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.lvstats .bad{color:var(--down)}.lvstats .good{color:var(--up)}
#mode:empty{display:none}
svg{display:block;width:100%;height:auto;overflow:visible}
.tick{fill:var(--muted);font-size:12px}.rowlab{fill:var(--muted);font-size:11px}
.hit{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:#1d2026f2;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #3a3f47;border-radius:14px;padding:10px 14px;display:none;box-shadow:0 12px 32px #000a;max-width:400px;z-index:2}
.tip .d{font-weight:600;font-size:13px}.tip .n{color:var(--accent);font-size:26px;font-weight:700;letter-spacing:-.02em}
.tip .s{color:var(--muted);font-size:12px;margin-top:2px;white-space:normal}
.vh{font-weight:600;font-size:14px;margin-bottom:4px}
.vr{display:flex;gap:12px;align-items:center;margin-top:10px}
.vr img{width:76px;height:43px;object-fit:cover;border-radius:8px;flex:none;background:#23262c}
.tip.cmp .vr{margin-top:6px;gap:10px}.tip.cmp .vr img{width:48px;height:27px;border-radius:5px}.tip.cmp .vt{font-size:12.5px}.tip.cmp .vd{font-size:11.5px;margin-top:0}
.tip .more{color:var(--muted);font-size:12px;margin-top:8px}
.vt{font-size:13.5px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vd{color:var(--muted);font-size:12.5px;margin-top:2px}
.hint{color:var(--muted);font-size:12px;text-align:center;padding:2px 16px 14px;opacity:.8}
.mid{min-width:0;display:flex;flex-direction:column;gap:16px}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;align-items:start}.row>.card{min-width:0}
@media (max-width:1300px) and (min-width:1101px){.row{grid-template-columns:1fr}}
@media (max-width:860px){.row{grid-template-columns:1fr}}
.card{padding:18px 20px}
.card h2{font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.09em;line-height:1.5}
.card h3{font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 6px}
table{width:100%;border-collapse:collapse;font-size:14.5px}td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r{text-align:right;white-space:nowrap;padding-left:12px;font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.bar{height:4px;border-radius:2px;margin-top:6px;opacity:.9}
.meta{color:var(--muted);font-size:12px;font-weight:400}
.up{color:var(--up)}.down{color:var(--down)}td.r .up,td.r .down{font-size:12.5px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.lhead{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:12px;font-weight:500;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:4px}
.lhead span:first-child{color:var(--ink);font-size:15px;font-weight:600}

.jr .tk span{position:absolute;left:44px;top:-7px;font-size:10px;color:var(--muted)}
.jr .pace{position:absolute;left:-8px;right:-8px;height:2px;border-radius:2px;background:#fff;bottom:var(--q)}
.jr .pace span{position:absolute;right:50px;top:-11px;font-size:10px;line-height:1.15;color:#fff;white-space:nowrap;text-align:right}

      tip.innerHTML=u.length?`<div class="vh">${u.length} video${u.length===1?'':'s'} published${cmp?` <span class="vd" style="font-weight:400">· ${dlab(d,{day:'numeric',month:'short'})}</span>`:''}</div>`+shown.map(z=>`<div class="vr"><img src="https://i.ytimg.com/vi/${z.id}/mqdefault.jpg" alt="" loading="lazy"><div><div class="vt">${esc(z.title.replace(/#\S+/g,'').trim()||z.title)}</div><div class="vd">${cmp?'':dlab(z.date,{day:'numeric',month:'short',year:'numeric'})+' · '}${esc(z.channel)}</div></div></div>`).join('')
          +(u.length>MAXV?`<div class="more">+${u.length-MAXV} more · listed under the chart</div>`:'')
        :`<div class="vh">No videos published</div><div class="vd">${dlab(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div>`;
    }else if((tip.classList.remove('cmp'),LT)){
      const z=LT[i],row=(c,l,v,dot)=>`<div style="display:flex;justify-content:space-between;gap:14px;font-size:13px;margin-top:3px;white-space:nowrap"><span><span style="display:inline-block;width:10px;height:${dot?4:3}px;border-radius:2px;background:${c};vertical-align:middle;margin-right:6px"></span>${l}</span><b>${v===null||v===undefined?'—':W<600?fmt(v):full(v)}</b></div>`;
      tip.innerHTML=`<div class="d">${dlab(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div>`+(z?row(CEIL,'Ceiling',z.ce)+row(FLOOR,'Floor',z.fl)+row(AMBER,'7-day average',z.av,1)+row('#9e9e9e','Daily views',z.dv)
        :`<div class="s">views not in yet · ${u.length} upload${u.length===1?'':'s'}</div>`);
    }else{
      const sub=`${v===null?'views not in yet · ':''}${u.length} upload${u.length===1?'':'s'}${u.length?': '+u.map(x=>esc(x.channel)).join(', '):''}`;
      tip.innerHTML=`<div class="d">${dlab(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div><div class="s" style="margin:0">${MLAB[metric]}</div><div class="n">${v===null?'—':metric==='subs'?signed(v):full(v)}</div>`
        +(CMP?`<div class="s" style="color:${GCOL}">Goal ${full(gl[i])}${v!==null?` · ${(v/gl[i]*100).toFixed(1)}% of it`:''}</div>`:'')+`<div class="s">${sub}</div>`;
    }
    tip.style.display='block';
    let px=r.left-cw.left+x(i)*k;const half=tip.offsetWidth/2;px=Math.min(Math.max(px,half+4),cw.width-half-4);
    const py=r.top-cw.top+(strip?stripTop:v===null?T+30:y(v))*k;const below=py-tip.offsetHeight-14<0;
    tip.style.left=px+'px';tip.style.top=(below?py+14:py-14)+'px';tip.style.transform=below?'translate(-50%,0)':'translate(-50%,-100%)';
  }
  svg.querySelectorAll('.hit').forEach(el=>{const i=+el.dataset.i;
    el.onmouseenter=()=>{show(i);detail(dd[i]);};
    el.onmousemove=e=>{if(UP)return;const r=svg.getBoundingClientRect(),sy=(e.clientY-r.top)/(r.width/W),on=sy>=stripTop-6;
      if(on!==el._strip){el._strip=on;show(i,on);}};
    el.onmouseleave=()=>{el._strip=undefined;};el.onclick=()=>{pinned=dd[i];show(i,el._strip);detail(dd[i]);};});
  svg.onmouseleave=()=>{show(dd.indexOf(pinned));detail(pinned);};
  show(dd.indexOf(pinned));detail(pinned);
}

function detail(d){
  const v=VIEWS[d],p=VIEWS[add(d,-1)];
  document.getElementById('dayTitle').textContent=dlab(d,{weekday:'long',day:'numeric',month:'long'})+(v?` · ${full(v.total)} views`+(v.subs?` · ${signed(v.subs_total)} subs`:''):' · views not in yet');
  document.getElementById('chTbl').innerHTML=v?Object.entries(v.channels).sort((a,b)=>b[1]-a[1]).map(([n,x])=>{
    let c='';if(p){const z=x-p.channels[n];c=` <span class="${z>=0?'up':'down'}">${z>=0?'▲':'▼'} ${fmt(Math.abs(z))}</span>`;}
    return `<tr><td><span class="dot" style="background:${col(n)}"></span>${esc(n)}<div class="bar" style="width:${v.total?Math.max(1,x/v.total*100):0}%;background:${col(n)}"></div></td><td class="r">${fmt(x)}${c}${v.subs?`<div class="meta">${signed(v.subs[n])} subs</div>`:''}</td></tr>`;}).join(''):'<tr><td class="empty">YouTube Analytics hasn\'t reported this day yet. It usually lands within 2–3 days.</td></tr>';
  const u=UPS[d]||[],missing=CH.filter(c=>!u.some(x=>x.channel===c));
  const clean=t=>t.replace(/#\S+/g,'').replace(/\s+/g,' ').trim()||t;
  const vrow=(x,rank,sub,max)=>`<a class="vrow" href="https://youtube.com/shorts/${x.id}" target="_blank" rel="noopener">
    ${rank?`<span class="rank">${rank}</span>`:''}<img src="https://i.ytimg.com/vi/${x.id}/mqdefault.jpg" alt="" loading="lazy">
    <span class="vinfo"><span class="vtitle">${esc(clean(x.title))}</span><span class="vsub"><i style="background:${col(x.channel)}"></i>${esc(x.channel)}${sub?` · ${sub}`:''}</span>
    ${max?`<span class="vbar"><b style="width:${x.views/max*100}%"></b></span>`:''}</span>
    <span class="vnum">${fmt(x.views)}</span></a>`;
  const head=(l,r)=>`<div class="lhead"><span>${l}</span><span>${r}</span></div>`;
  document.getElementById('upList').innerHTML=head(`${u.length} video${u.length===1?'':'s'} published`,'Views so far')+
    (u.length?u.map(x=>vrow(x,0,x.time)).join(''):'<div class="empty">No uploads.</div>')+
    (d<D.today&&missing.length?`<div class="miss">No upload ${missing.map(c=>`<span><i style="background:${col(c)}"></i>${esc(c)}</span>`).join('')}</div>`:'');
  const t=v&&v.top||[];
  document.getElementById('topList').innerHTML=head('Top Shorts that day','Views that day')+
    (t.length?t.map((x,k)=>vrow(x,k+1,'',t[0].views)).join(''):'<div class="empty">Not in yet.</div>');
}
// Realtime card: 48-hour views from hourly public view-count readings (yt_live.py), Studio-style
function realtime(){
  const R=D.live,el=document.getElementById('rt'),tm=t=>t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(!R){el.innerHTML='<div class="rh">Realtime</div><div class="k" style="margin-top:8px">No readings yet.</div>';return;}
  const end=new Date(R.read),ago=Math.round((Date.now()-end)/6e4),agoS=ago<60?`${Math.max(ago,0)} min ago`:ago<1440?`${Math.round(ago/60)} h ago`:`${Math.round(ago/1440)} d ago`;
  const full48=R.covered_h>=47.5,goal=D.goal_day*2,h=R.hours,mx=Math.max(1,...h.filter(v=>v!==null)),any=h.some(v=>v!==null);
  const span=R.covered_h<1?`${Math.max(1,Math.round(R.covered_h*60))} minutes`:`${R.covered_h.toFixed(1).replace(/\.0$/,'')} hours`;
  const BW=280,BH=70,bw=BW/48;
  let bars=`<svg viewBox="0 0 ${BW} ${BH}" id="rtb">`;
  const seedEnd=R.seed_until?new Date(R.seed_until):null,isSeed=k=>seedEnd&&+end-(47-k)*36e5<=+seedEnd;  // hour fully before the first reading
  h.forEach((v,k)=>{const bh=v===null?0:Math.max(v>0?1.5:0,Math.max(0,v)/mx*(BH-4));
    bars+=`<rect x="${k*bw+.6}" y="${BH-bh}" width="${bw-1.2}" height="${bh}" rx="1.2" fill="var(--accent)" opacity="${v===null?0:R.est&&R.est[k]?.32:k===47?1:.7}"/><rect class="rb" data-k="${k}" x="${k*bw}" y="0" width="${bw}" height="${BH}" fill="transparent"/>`;});
  bars+=`<line x1="0" x2="${BW}" y1="${BH}" y2="${BH}" stroke="#555"/></svg>`;
  const chs=Object.entries(R.channels).sort((a,b)=>b[1]-a[1]);
  const last60=h[47];
  el.innerHTML=`<div class="rh">Realtime</div><div class="live"><i></i>Updating hourly · read ${agoS}</div>
    <div class="sec"><div class="k">Views · ${full48?'Last 48 hours':any?`last ${span} (building up to 48 hours)`:'Last 48 hours'}</div>
      <div class="big">${any?full(R.total):'—'}</div>
      ${full48?`<div class="goal"><b style="width:${Math.min(100,R.total/goal*100)}%"></b></div><div class="k">${(R.total/goal*100).toFixed(1)}% of the ${fmt(goal)} goal</div>`:''}
      ${bars}<div class="bx"><span>48h ago</span><span>Now</span></div><div class="bt" id="rtt"></div></div>
    <div class="sec"><div class="k">Views · Last 60 minutes</div><div class="big" style="font-size:24px">${last60===null?'—':full(last60)}</div></div>
    <div class="sec"><div class="k" style="margin-bottom:4px">By channel</div>${chs.map(([n,v])=>`<div class="crow"><span><span class="dot" style="background:${col(n)}"></span>${esc(n)}</span><b>${any?full(v):'—'}</b></div>`).join('')}</div>
    <div class="sec"><div class="lhead"><span>Top content</span><span>Views</span></div>${R.top.length?R.top.map(x=>`<a class="vrow" href="https://youtube.com/shorts/${x.id}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${x.id}/mqdefault.jpg" alt="" loading="lazy"><span class="vinfo"><span class="vtitle">${esc(x.title.replace(/#\S+/g,'').trim()||x.title)}</span><span class="vsub"><i style="background:${col(x.channel)}"></i>${esc(x.channel)}</span></span><span class="vnum">${fmt(x.views)}</span></a>`).join(''):'<div class="empty">After the next reading.</div>'}</div>
    <div class="note">${R.exact?`Totals are Studio's exact 48-hour figures, read at ${tm(new Date(R.exact))}; the bars are shaped from public view counts. `:''}Added up from every video's public view count, read every hour while Jarvis's PC is on. ${R.exact?'':'Close to Studio\'s Realtime card, not identical. '}Last read ${tm(end)}.${seedEnd&&seedEnd>new Date(+end-48*36e5)?` Before ${tm(seedEnd)} on ${seedEnd.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} the hours are Studio's own figures; top content counts from then.`:''}${R.est&&R.est.some(Boolean)?' Lighter bars: the PC was off, so those hours are shaped like the same hours on other days (the total is exact).':''}</div>`;
  const tip=document.getElementById('rtt'),idle=()=>tip.textContent='';
  el.querySelectorAll('.rb').forEach(b=>b.onmouseenter=()=>{const k=+b.dataset.k,s=new Date(end-(48-k)*36e5);
    tip.textContent=h[k]===null?`${tm(s)}–${tm(new Date(+s+36e5))} · no reading yet`:`${tm(s)}–${tm(new Date(+s+36e5))} · ${full(Math.max(0,h[k]))} views${isSeed(k)?' (from Studio)':''}`;});
  document.getElementById('rtb').onmouseleave=idle;
}
realtime();
function journey(){  // this calendar month's reported views vs the monthly goal; "pace" = where the demo goal line says we'd be by now
  const mo=D.today.slice(0,7),nd=new Date(+mo.slice(0,4),+mo.slice(5,7),0).getDate();
  const md=[...Array(nd)].map((_,k)=>`${mo}-${String(k+1).padStart(2,'0')}`),rep=md.filter(d=>VIEWS[d]);
  const got=rep.reduce((s,d)=>s+VIEWS[d].total,0),pace=rep.reduce((s,d)=>s+goalOf(d),0);
  const p=got/GM*100,q=pace/GM*100,pc=v=>v<10?v.toFixed(1):Math.round(v);
  document.getElementById('jr').innerHTML=`<div class="k">${dlab(md[0],{month:'long'})} journey</div><div class="pc">${pc(p)}%</div>
    <div class="of"><b>${fmt(got)}</b> of ${fmt(GM)}</div>
    <div class="trk" style="--p:${Math.min(100,p)}%;--q:${Math.min(100,q)}%">${[25,50,75,100].map(t=>`<div class="tk" style="--t:${t}%"><span>${t}%</span></div>`).join('')}
      <div class="fill"></div>${rep.length?`<div class="pace" title="Where the goal line says we'd be by ${dlab(rep[rep.length-1])}"><span>pace <br>${pc(q)}%</span></div>`:''}</div>
    <div class="of">${rep.length?`to ${dlab(rep[rep.length-1])}, ${rep.length} of ${nd} days`:'no days reported yet'}<br>needs <b>${fmt(Math.max(0,GM-got)/Math.max(1,nd-rep.length))}</b>/day</div>`;
}
journey();
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150);});
if(D.days.length)draw();else document.getElementById('chart').innerHTML='<p class="hint">No data yet.</p>';
</script></body></html>
