<title>YouTube Tracker</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--panel:#181818;--tab:#232323;--border:#3a3a3a;--ink:#f1f1f1;--muted:#aaaaaa;--grid:#333;--accent:#3ea6ff;--up:#2ba640;--down:#ff4e45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Roboto,system-ui,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:clamp(22px,3.4vw,36px);font-weight:700;text-align:center;margin:8px 0 22px;letter-spacing:-.01em}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs>div{padding:18px 12px 20px;text-align:center;background:var(--tab);border-left:1px solid var(--border);cursor:pointer;position:relative;transition:background .15s}
.tabs>div:first-child{border-left:0}.tabs>div:hover{background:#2a2a2a}
.tabs>div.sel{background:var(--panel)}.tabs>div.sel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.lab{color:var(--muted);font-size:15px}.val{font-size:clamp(24px,3vw,38px);font-weight:700;margin:4px 0 2px;display:flex;justify-content:center;align-items:center;gap:10px}
.sub{color:var(--muted);font-style:italic;font-size:14px}
.badge{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;color:#fff}
@media (max-width:760px){.tabs{grid-template-columns:1fr 1fr}.tabs>div:nth-child(3){border-left:0}.tabs>div{border-top:1px solid var(--border)}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:16px 18px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:#2c2c2c;border-color:#777}.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button.on{background:#2c2c2c;color:var(--ink)}
.chartwrap{position:relative;padding:18px 8px 6px 16px}
.lvstats{display:none;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 18px 0}
.lvstats.on{display:grid}@media (max-width:760px){.lvstats{grid-template-columns:repeat(2,1fr)}}
.lvstats>div{background:#202020;border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.lvstats .k{color:var(--muted);font-size:12px}.lvstats .v{font-size:18px;font-weight:700;margin-top:2px}
.lvstats .bad{color:var(--down)}.lvstats .good{color:var(--up)}
#mode:empty{display:none}
.lvstats .k{background:none;border:0;padding:0}
svg{display:block;width:100%;height:auto;overflow:visible}
.tick{fill:var(--muted);font-size:13px}.rowlab{fill:var(--muted);font-size:11px}
.hit{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:#1b1b1b;border:1px solid #555;border-radius:12px;padding:10px 16px;display:none;box-shadow:0 6px 24px #0008;max-width:320px;z-index:2}
.tip .d{font-weight:500;font-size:14px}.tip .n{color:var(--accent);font-size:26px;font-weight:500}
.tip .s{color:var(--muted);font-size:12px;margin-top:2px;white-space:normal}
.tip{max-width:400px}.vh{font-weight:500;font-size:15px;margin-bottom:4px}
.vr{display:flex;gap:12px;align-items:center;margin-top:10px}
.vr img{width:76px;height:43px;object-fit:cover;border-radius:7px;flex:none;background:#333}
.vt{font-size:14px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vd{color:var(--muted);font-size:13px;margin-top:2px}
.hint{color:var(--muted);font-size:13px;text-align:center;padding:2px 0 14px}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-top:16px}
@media (max-width:860px){.row{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px 20px}
.card h2{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}
.card h3{font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 6px}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:8px 0;border-bottom:1px solid var(--border);vertical-align:top}
td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.bar{height:4px;border-radius:2px;margin-top:5px;opacity:.85}
.meta{color:var(--muted);font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.lhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:500;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.lhead span:first-child{color:var(--ink);font-size:15px}
.vrow{display:flex;align-items:center;gap:12px;padding:8px 6px;margin:0 -6px;border-radius:10px;text-decoration:none!important}
.vrow:hover{background:#242424}
.vrow img{width:88px;height:50px;object-fit:cover;border-radius:8px;flex:none;background:#2a2a2a}
.rank{width:16px;color:var(--muted);font-size:14px;text-align:center;flex:none}
.vinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.vtitle{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vsub{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.vsub i,.miss i{width:8px;height:8px;border-radius:50%;display:inline-block}
.vbar{height:3px;background:#2a2a2a;border-radius:2px;overflow:hidden;margin-top:2px}.vbar b{display:block;height:100%;background:var(--accent)}
.vnum{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;flex:none;padding-left:6px}
.miss{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin-top:10px}
.miss span{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
</style></head><body><main>

    ['views','Views',fmt(sum)+(ch!==null?badge(ch>=0):''),ch!==null?`${Math.abs(ch).toFixed(0)}% ${ch>=0?'more':'less'} than previous ${n} days`:`${dlab(vd[0]||D.today)} – ${dlab(vd[n-1]||D.today)}`],
    ['uploads','Uploads',String(uploads.length),missed?`${missed} missed channel-day${missed>1?'s':''}`:'no missed days'],
    ['avg','Average per day',fmt(n?sum/n:0),`daily goal ${fmt(D.goal_day)} · ${n?(sum/n/D.goal_day*100).toFixed(1):0}%`],
    ['subs','Subscribers',signed(ssum)+(sch!==null?badge(sch>=0):''),sch!==null?`${Math.abs(sch).toFixed(0)}% ${sch>=0?'more':'less'} than previous ${n} days`:'net gained']
  ].map(([m,l,v,s])=>`<div class="mt ${metric===m?'sel':''}" data-m="${m}" role="tab" tabindex="0"><div class="lab">${l}</div><div class="val">${v}</div><div class="sub">${s}</div></div>`).join('');
  document.querySelectorAll('.mt').forEach(t=>t.onclick=t.onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter')return;
    metric=t.dataset.m;draw();});
}

function controls(){
  document.getElementById('chips').innerHTML=`<button class="chip ${sel.size?'':'on'}" data-c="">All channels</button>`+CH.map(c=>`<button class="chip ${sel.has(c)?'on':''}" data-c="${esc(c)}"><i style="background:${col(c)}"></i>${esc(c)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(!c)sel.clear();else sel.has(c)?sel.delete(c):sel.add(c);draw();});
  document.getElementById('range').innerHTML=[[7,'7 days'],[28,'28 days'],['all','All']].map(([v,l])=>`<button class="${range===v?'on':''}" data-v="${v}">${l}</button>`).join('');
  document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{range=b.dataset.v==='all'?'all':+b.dataset.v;pinned=null;draw();});
  const m=document.getElementById('mode');
  m.innerHTML=metric==='avg'&&!sel.size&&LVL.length?[['line','Line'],['levels','Levels']].map(([v,l])=>`<button class="${avgMode===v?'on':''}" data-v="${v}">${l}</button>`).join(''):'';
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{avgMode=b.dataset.v;if(avgMode==='levels')range='all';pinned=null;draw();});
}

function draw(){
  controls();
  const LV=metric==='avg'&&avgMode==='levels'&&!sel.size&&LVL.length>0;
  const dd0=domain();tabs(dd0);
  const dd=LV?dd0.concat([...Array(28)].map((_,k)=>add(D.today,k+1))):dd0,N=dd.length;  // room for the ghost level
  const rows=sel.size?CH.filter(c=>sel.has(c)):CH;
  const W=Math.max(300,document.getElementById('cw').clientWidth-24),Hc=W<600?220:300,L=10,R=52,T=10;
  const stripTop=Hc+10,stripH=30,axisY=stripTop+stripH+6,Ht=axisY+34;
  const UP=metric==='uploads';
  const vday=(d,c)=>VIEWS[d]?(c?VIEWS[d].channels[c]:VIEWS[d].total):null;
  const roll=(d,c)=>{const w=[...Array(7)].map((_,k)=>vday(add(d,-k),c)).filter(v=>v!==null);return VIEWS[d]&&w.length?w.reduce((a,b)=>a+b,0)/w.length:null;};
  const f=LV?(d=>r7(d)):metric==='avg'?roll:metric==='subs'?subsOf:vday;
  // levels: each box spans its dates; numbers frozen (closed) or live (open); the ghost is where the next flip lands
  const lvs=LV?LVL.map((l,k)=>({...l,...levelNums(l),k})):[];
  const open=lvs.find(l=>!l.end),ghost=open&&open.c!==null?{f:open.c,c:open.c+(open.c-open.f)}:null;
  const upc=dd.map(d=>rows.map(c=>(UPS[d]||[]).filter(u=>u.channel===c).length));
  const lines=UP?(sel.size?rows.map((c,r)=>({c,v:upc.map(a=>a[r])})):[{c:null,v:upc.map(a=>a.reduce((s,k)=>s+k,0))}])
    :sel.size?rows.map(c=>({c,v:dd.map(d=>f(d,c))})):[{c:null,v:dd.map(d=>f(d,null))}];
  const vals=lines.flatMap(l=>l.v.filter(v=>v!==null)).concat(LV?lvs.flatMap(l=>[l.c,l.standard||0].filter(v=>v!==null)).concat(ghost?[ghost.c]:[]):[]),mx=Math.max(1,...vals),mn=Math.min(0,...vals);
  let step,top,bot=0;
  if(UP){step=Math.max(1,Math.ceil(mx/4));top=step*Math.ceil((mx+.5)/step);}
  else{const raw=Math.max(1,(mx-mn)/3),mag=10**Math.floor(Math.log10(raw));step=[1,1.5,2,2.5,5,10].map(k=>k*mag).find(s=>s>=raw);if(metric==='subs')step=Math.max(1,Math.round(step));
    top=step*Math.ceil(mx*1.05/step);bot=mn<0?-step*Math.ceil(-mn*1.05/step):0;}
  const valOf=d=>UP?upc[dd.indexOf(d)].reduce((s,k)=>s+k,0):(sel.size?(VIEWS[d]?rows.reduce((s,c)=>s+f(d,c),0):null):f(d,null));
  const band=(W-L-R)/N,x=i=>L+band*(i+.5),y=v=>T+(Hc-T)*(top-v)/(top-bot);
  let s=`<svg viewBox="0 0 ${W} ${Ht}" id="svg"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ea6ff" stop-opacity=".22"/><stop offset="1" stop-color="#3ea6ff" stop-opacity=".03"/></linearGradient><g id="shorts"><rect x="-6" y="-11" width="12" height="22" rx="6" transform="rotate(30)" fill="#d9d9d9"/><path d="M-2.6,-4.2 L4,0 L-2.6,4.2Z" fill="#181818"/></g></defs>`;
  for(let v=bot;v<=top+(UP?0:1);v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v?'var(--grid)':'#777'}"/><text class="tick" x="${W-R+12}" y="${y(v)+5}">${v<0?'−'+fmt(-v):fmt(v)}</text>`;
  const pend=dd.findIndex(d=>d>D.last_day),tI=dd.indexOf(D.today),pendR=x(tI)+band/2;
  if(pend>=0&&!UP)s+=`<rect x="${x(pend)-band/2}" y="${T}" width="${pendR-(x(pend)-band/2)}" height="${Hc-T}" fill="#ffffff08"/>`+(W<600||LV?'':`<text class="tick" x="${(x(pend)-band/2+pendR)/2}" y="${T+16}" text-anchor="middle" font-size="11">views not in yet</text>`);
  if(LV){
    const xi=dt=>{const i=dd.indexOf(dt);return i>=0?i:dt<dd[0]?0:N-1;};
    const mids=[];
    lvs.forEach(l=>{if(l.f===null)return;const c=LCOL[l.k%LCOL.length],a=x(xi(l.start))-band/2,b=x(xi(l.end||D.last_day))+band/2;
      if(b<=L)return;
      s+=`<rect x="${a}" y="${y(l.c)}" width="${b-a}" height="${y(l.f)-y(l.c)}" fill="${c}" fill-opacity=".09"/>
        <line x1="${a}" x2="${b}" y1="${y(l.c)}" y2="${y(l.c)}" stroke="${c}" stroke-width="1.5"/><line x1="${a}" x2="${b}" y1="${y(l.f)}" y2="${y(l.f)}" stroke="${c}" stroke-width="1.5"/>
        <line x1="${a}" x2="${b}" y1="${y(l.a)}" y2="${y(l.a)}" stroke="${c}" stroke-dasharray="2 4" stroke-width="1.5"/>
        <text x="${a+5}" y="${y(l.c)-6}" fill="${c}" font-size="12" font-weight="500">Level ${l.k+1}</text>`;
      mids.push([(a+b)/2,y(l.a)]);
      if(!l.end&&l.standard)s+=`<line x1="${a}" x2="${W-R}" y1="${y(l.standard)}" y2="${y(l.standard)}" stroke="#f1f1f1" stroke-width="3"/><text x="${W-R-4}" y="${y(l.standard)-7}" fill="#f1f1f1" font-size="12" font-weight="700" text-anchor="end">standard ${fmt(l.standard)}</text>`;});
    for(let k=1;k<mids.length;k++)s+=`<line x1="${mids[k-1][0]}" y1="${mids[k-1][1]}" x2="${mids[k][0]}" y2="${mids[k][1]}" stroke="#bbb" stroke-dasharray="3 5" stroke-width="1.5"/>`;
    if(ghost&&tI>=0){const a=x(tI)+band/2,b=W-R;
      s+=`<rect x="${a}" y="${y(ghost.c)}" width="${b-a}" height="${y(ghost.f)-y(ghost.c)}" fill="none" stroke="#999" stroke-dasharray="6 5" stroke-width="1.5"/>
        <text x="${a+6}" y="${y(ghost.c)-6}" fill="#aaa" font-size="12">${W<600?'next':`next level ${fmt(ghost.f)}–${fmt(ghost.c)}`}</text>`;}
    // 7-day average, green while rising, red while falling
    const v=dd.map(f);
    for(let i=1;i<N;i++)if(v[i]!==null&&v[i-1]!==null)s+=`<line x1="${x(i-1)}" y1="${y(v[i-1])}" x2="${x(i)}" y2="${y(v[i])}" stroke="${v[i]>=v[i-1]?'var(--up)':'var(--down)'}" stroke-width="3" stroke-linecap="round"/>`;
  }
  const st=document.getElementById('lvStats');
  if(LV&&open){
    const days=D.days.map(e=>e.date).filter(d=>d>=open.start).map(d=>[d,r7(d)]).filter(p=>p[1]!==null);
    const below=open.standard?days.filter(p=>p[1]<open.standard).length:0;
    let streak=0;for(let i=days.length-1;i>=0&&open.standard&&days[i][1]>=open.standard;i--)streak++;
    st.className='lvstats on';
    st.innerHTML=[['Level',`${open.k+1}`,`${open.k} flip${open.k===1?'':'s'} so far`],['Standard',open.standard?fmt(open.standard):'—','min 7-day average'],
      ['Days below standard',String(below),'this level',below?'bad':'good'],['Streak at standard',`${streak} day${streak===1?'':'s'}`,'7-day avg ≥ standard'],
      ['Next floor',open.c!==null?fmt(open.c):'—','this level\'s ceiling so far']]
      .map(([k,v,s2,c])=>`<div><div class="k">${k}</div><div class="v ${c||''}">${v}</div><div class="k">${s2}</div></div>`).join('');
  }else{st.className='lvstats';st.innerHTML='';}
  if(!LV)lines.forEach(l=>{
    const pts=l.v.map((v,i)=>v===null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;
    const c=l.c?col(l.c):'var(--accent)';
    if(!l.c)s+=`<path d="M${pts[0][0]},${y(0)} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${y(0)}Z" fill="url(#g)"/>`;
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${l.c?2.5:3}" stroke-linejoin="round"/>`;
    if(N<=31)pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${N<=10?4:2.5}" fill="${c}"/>`);
  });
  if(metric==='avg'&&!LV&&!sel.size&&D.goal_day<=top)s+=`<line x1="${L}" x2="${W-R}" y1="${y(D.goal_day)}" y2="${y(D.goal_day)}" stroke="#8fd14a" stroke-dasharray="6 5"/>`;
  // upload markers, like Studio: one Shorts icon under each day with an upload, a count when there were several
  const sc=Math.max(.6,Math.min(1.2,band/22));
  if(!UP)dd.forEach((d,i)=>{const k=(UPS[d]||[]).filter(u=>rows.includes(u.channel)).length;if(!k)return;
    if(k===1){s+=`<g transform="translate(${x(i)},${stripTop+13}) scale(${sc})"><use href="#shorts"/></g>`;return;}
    // several uploads: Studio's grey rounded square with the count
    const b=Math.max(12,Math.min(26,band*.8));
    s+=`<rect x="${x(i)-b/2}" y="${stripTop+13-b/2}" width="${b}" height="${b}" rx="${b*.18}" fill="#6b6b6b"/><text x="${x(i)}" y="${stripTop+13+b*.18}" fill="#fff" font-size="${b*.52}" font-weight="500" text-anchor="middle">${k}</text>`;});
  // axis
  const every=Math.max(1,Math.ceil(N/(W<600?4:8)));
  s+=`<line x1="${L}" x2="${W-R}" y1="${axisY}" y2="${axisY}" stroke="#555"/>`;
  dd.forEach((d,i)=>{if((N-1-i)%every===0)s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${axisY}" y2="${axisY+5}" stroke="#555"/><text class="tick" x="${x(i)}" y="${axisY+22}" text-anchor="middle">${dlab(d)}</text>`;});
  s+=`<line id="guide" y1="${T}" y2="${axisY}" stroke="#888" visibility="hidden"/>`;
  dd.forEach((d,i)=>{if(d<=D.today)s+=`<rect class="hit" data-i="${i}" x="${x(i)-band/2}" y="${T}" width="${band}" height="${axisY-T}" fill="transparent"/>`;});
  document.getElementById('chart').innerHTML=s+'</svg>';
  const svg=document.getElementById('svg'),tip=document.getElementById('tip'),guide=document.getElementById('guide');
  const lastData=[...dd].reverse().find(d=>VIEWS[d]);
  if(pinned===null||!dd.includes(pinned))pinned=lastData||dd[N-1];
  function show(i,strip){
    const d=dd[i],v=valOf(d),u=(UPS[d]||[]).filter(u=>rows.includes(u.channel)),r=svg.getBoundingClientRect(),k=r.width/W,cw=document.getElementById('cw').getBoundingClientRect();
    guide.setAttribute('x1',x(i));guide.setAttribute('x2',x(i));guide.setAttribute('visibility','visible');
    if(UP||strip){  // Studio's "N videos published" card
      tip.innerHTML=u.length?`<div class="vh">${u.length} video${u.length===1?'':'s'} published</div>`+u.map(z=>`<div class="vr"><img src="https://i.ytimg.com/vi/${z.id}/mqdefault.jpg" alt="" loading="lazy"><div><div class="vt">${esc(z.title)}</div><div class="vd">${dlab(z.date,{day:'numeric',month:'short',year:'numeric'})} · ${esc(z.channel)}</div></div></div>`).join('')
        :`<div class="vh">No videos published</div><div class="vd">${dlab(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div>`;
    }else{
      const sub=`${v===null?'views not in yet · ':''}${u.length} upload${u.length===1?'':'s'}${u.length?': '+u.map(x=>esc(x.channel)).join(', '):''}`;
      tip.innerHTML=`<div class="d">${dlab(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div><div class="s" style="margin:0">${MLAB[metric]}</div><div class="n">${v===null?'—':metric==='subs'?signed(v):full(v)}</div><div class="s">${sub}</div>`;
    }
    tip.style.display='block';
    let px=r.left-cw.left+x(i)*k;const half=tip.offsetWidth/2;px=Math.min(Math.max(px,half+4),cw.width-half-4);
    const py=r.top-cw.top+(strip?stripTop:v===null?T+30:y(v))*k;const below=py-tip.offsetHeight-14<0;
    tip.style.left=px+'px';tip.style.top=(below?py+14:py-14)+'px';tip.style.transform=below?'translate(-50%,0)':'translate(-50%,-100%)';
  }
  svg.querySelectorAll('.hit').forEach(el=>{const i=+el.dataset.i;
    el.onmouseenter=()=>{show(i);detail(dd[i]);};
    el.onmousemove=e=>{if(UP)return;const r=svg.getBoundingClientRect(),sy=(e.clientY-r.top)/(r.width/W),on=sy>=stripTop-6;
      if(on!==el._strip){el._strip=on;show(i,on);}};
    el.onmouseleave=()=>{el._strip=undefined;};el.onclick=()=>{pinned=dd[i];show(i,el._strip);detail(dd[i]);};});
  svg.onmouseleave=()=>{show(dd.indexOf(pinned));detail(pinned);};
  show(dd.indexOf(pinned));detail(pinned);
}

function detail(d){
  const v=VIEWS[d],p=VIEWS[add(d,-1)];
  document.getElementById('dayTitle').textContent=dlab(d,{weekday:'long',day:'numeric',month:'long'})+(v?` · ${full(v.total)} views`+(v.subs?` · ${signed(v.subs_total)} subs`:''):' · views not in yet');
  document.getElementById('chTbl').innerHTML=v?Object.entries(v.channels).sort((a,b)=>b[1]-a[1]).map(([n,x])=>{
    let c='';if(p){const z=x-p.channels[n];c=` <span class="${z>=0?'up':'down'}">${z>=0?'▲':'▼'} ${fmt(Math.abs(z))}</span>`;}
    return `<tr><td><span class="dot" style="background:${col(n)}"></span>${esc(n)}<div class="bar" style="width:${v.total?Math.max(1,x/v.total*100):0}%;background:${col(n)}"></div></td><td class="r">${fmt(x)}${c}${v.subs?`<div class="meta">${signed(v.subs[n])} subs</div>`:''}</td></tr>`;}).join(''):'<tr><td class="empty">YouTube Analytics hasn\'t reported this day yet. It usually lands within 2–3 days.</td></tr>';
  const u=UPS[d]||[],missing=CH.filter(c=>!u.some(x=>x.channel===c));
  const clean=t=>t.replace(/#\S+/g,'').replace(/\s+/g,' ').trim()||t;
  const vrow=(x,rank,sub,max)=>`<a class="vrow" href="https://youtube.com/shorts/${x.id}" target="_blank" rel="noopener">
    ${rank?`<span class="rank">${rank}</span>`:''}<img src="https://i.ytimg.com/vi/${x.id}/mqdefault.jpg" alt="" loading="lazy">
    <span class="vinfo"><span class="vtitle">${esc(clean(x.title))}</span><span class="vsub"><i style="background:${col(x.channel)}"></i>${esc(x.channel)}${sub?` · ${sub}`:''}</span>
    ${max?`<span class="vbar"><b style="width:${x.views/max*100}%"></b></span>`:''}</span>
    <span class="vnum">${fmt(x.views)}</span></a>`;
  const head=(l,r)=>`<div class="lhead"><span>${l}</span><span>${r}</span></div>`;
  document.getElementById('upList').innerHTML=head(`${u.length} video${u.length===1?'':'s'} published`,'Views so far')+
    (u.length?u.map(x=>vrow(x,0,x.time)).join(''):'<div class="empty">No uploads.</div>')+
    (d<D.today&&missing.length?`<div class="miss">No upload ${missing.map(c=>`<span><i style="background:${col(c)}"></i>${esc(c)}</span>`).join('')}</div>`:'');
  const t=v&&v.top||[];
  document.getElementById('topList').innerHTML=head('Top Shorts that day','Views that day')+
    (t.length?t.map((x,k)=>vrow(x,k+1,'',t[0].views)).join(''):'<div class="empty">Not in yet.</div>');
}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150);});
if(D.days.length)draw();else document.getElementById('chart').innerHTML='<p class="hint">No data yet.</p>';
</script></body></html>
