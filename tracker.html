.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs>div{padding:18px 12px 20px;text-align:center;background:var(--tab);border-left:1px solid var(--border);cursor:pointer;position:relative;transition:background .15s}

.tabs>div.sel{background:var(--panel)}.tabs>div.sel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.lab{color:var(--muted);font-size:15px}.val{font-size:clamp(24px,3vw,38px);font-weight:700;margin:4px 0 2px;display:flex;justify-content:center;align-items:center;gap:10px}
.sub{color:var(--muted);font-style:italic;font-size:14px}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:16px 18px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:#2c2c2c;border-color:#777}.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button.on{background:#2c2c2c;color:var(--ink)}
.chartwrap{position:relative;padding:18px 8px 6px 16px}
svg{display:block;width:100%;height:auto;overflow:visible}
.tick{fill:var(--muted);font-size:13px}.rowlab{fill:var(--muted);font-size:11px}
.hit{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:#1b1b1b;border:1px solid #555;border-radius:12px;padding:10px 16px;display:none;box-shadow:0 6px 24px #0008;max-width:320px;z-index:2}
.tip .d{font-weight:500;font-size:14px}.tip .n{color:var(--accent);font-size:26px;font-weight:500}
.tip .s{color:var(--muted);font-size:12px;margin-top:2px;white-space:normal}
.hint{color:var(--muted);font-size:13px;text-align:center;padding:2px 0 14px}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-top:16px}
@media (max-width:860px){.row{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px 20px}
.card h2{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}
.card h3{font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 6px}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:8px 0;border-bottom:1px solid var(--border);vertical-align:top}
td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.bar{height:4px;border-radius:2px;margin-top:5px;opacity:.85}
.meta{color:var(--muted);font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}

let range=28, sel=new Set(), pinned=null, metric='views', bestDay=null;

document.getElementById('foot').textContent=`Daily views and uploads across ${CH.length} channels (${CH.join(', ')}), from YouTube Analytics. Views run about 2–3 days behind; uploads are live. Updated daily, last at ${D.built}.`;

function viewsOf(day){const d=VIEWS[day];if(!d)return null;return sel.size?[...sel].reduce((s,n)=>s+(d.channels[n]||0),0):d.total;}
function domain(){const n=range==='all'?Math.round((new Date(D.today)-new Date(D.days[0].date))/864e5)+1:range;const out=[];for(let i=n-1;i>=0;i--)out.push(add(D.today,-i));return out;}

function tabs(dd){
  const vd=dd.filter(d=>VIEWS[d]),sum=vd.reduce((s,d)=>s+viewsOf(d),0),n=vd.length;
  const prev=vd.map(d=>add(d,-n)).filter(d=>VIEWS[d]),psum=prev.reduce((s,d)=>s+viewsOf(d),0);
  const chans=sel.size?[...sel]:CH,uploads=dd.flatMap(d=>(UPS[d]||[]).filter(u=>chans.includes(u.channel)));
  const missed=chans.reduce((s,c)=>s+dd.filter(d=>d<D.today&&!(UPS[d]||[]).some(u=>u.channel===c)).length,0);
  const best=vd.reduce((a,d)=>!a||viewsOf(d)>viewsOf(a)?d:a,null);bestDay=best;
  const who=sel.size?[...sel].join(' + '):'Your channels';
  document.getElementById('head').textContent=`${who} got ${full(sum)} views in ${n} days`;
  const ch=psum&&prev.length===n?(sum-psum)/psum*100:null;
  const badge=up=>`<span class="badge" style="background:${up?'var(--up)':'#666'}">${up?'↑':'↓'}</span>`;
  document.getElementById('tabs').innerHTML=[
    ['views','Views',fmt(sum)+(ch!==null?badge(ch>=0):''),ch!==null?`${Math.abs(ch).toFixed(0)}% ${ch>=0?'more':'less'} than previous ${n} days`:`${dlab(vd[0]||D.today)} – ${dlab(vd[n-1]||D.today)}`],
    ['uploads','Uploads',String(uploads.length),missed?`${missed} missed channel-day${missed>1?'s':''}`:'no missed days'],
    ['avg','Average per day',fmt(n?sum/n:0),`daily goal ${fmt(D.goal_day)} · ${n?(sum/n/D.goal_day*100).toFixed(1):0}%`],
    ['best','Best day',best?fmt(viewsOf(best)):'-',best?dlab(best,{weekday:'short',day:'numeric',month:'short'}):'']
  ].map(([m,l,v,s])=>`<div class="mt ${metric===m?'sel':''}" data-m="${m}" role="tab" tabindex="0"><div class="lab">${l}</div><div class="val">${v}</div><div class="sub">${s}</div></div>`).join('');
  document.querySelectorAll('.mt').forEach(t=>t.onclick=t.onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter')return;
    metric=t.dataset.m;if(metric==='best'&&bestDay)pinned=bestDay;draw();});
}

function controls(){
  document.getElementById('chips').innerHTML=`<button class="chip ${sel.size?'':'on'}" data-c="">All channels</button>`+CH.map(c=>`<button class="chip ${sel.has(c)?'on':''}" data-c="${esc(c)}"><i style="background:${col(c)}"></i>${esc(c)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(!c)sel.clear();else sel.has(c)?sel.delete(c):sel.add(c);draw();});
  document.getElementById('range').innerHTML=[[7,'7 days'],[28,'28 days'],['all','All']].map(([v,l])=>`<button class="${range===v?'on':''}" data-v="${v}">${l}</button>`).join('');
  document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{range=b.dataset.v==='all'?'all':+b.dataset.v;pinned=null;draw();});
}

function draw(){
  controls();
  const dd=domain(),N=dd.length;tabs(dd);
  const rows=sel.size?CH.filter(c=>sel.has(c)):CH;
  const W=Math.max(300,document.getElementById('cw').clientWidth-24),Hc=W<600?220:300,L=10,R=52,T=10;
  const stripTop=Hc+10,stripH=30,axisY=stripTop+stripH+6,Ht=axisY+34;
  const UP=metric==='uploads';
  const vday=(d,c)=>VIEWS[d]?(c?VIEWS[d].channels[c]:VIEWS[d].total):null;
  const roll=(d,c)=>{const w=[...Array(7)].map((_,k)=>vday(add(d,-k),c)).filter(v=>v!==null);return VIEWS[d]&&w.length?w.reduce((a,b)=>a+b,0)/w.length:null;};
  const f=metric==='avg'?roll:vday;
  const lines=UP?[]:sel.size?rows.map(c=>({c,v:dd.map(d=>f(d,c))})):[{c:null,v:dd.map(d=>f(d,null))}];
  const upc=dd.map(d=>rows.map(c=>(UPS[d]||[]).filter(u=>u.channel===c).length));
  const mx=Math.max(1,...(UP?upc.map(a=>a.reduce((s,k)=>s+k,0)):lines.flatMap(l=>l.v.filter(v=>v!==null))));
  let step,top;
  if(UP){step=Math.max(1,Math.ceil(mx/4));top=step*Math.ceil((mx+.5)/step);}
  else{const raw=mx/3,mag=10**Math.floor(Math.log10(raw));step=[1,1.5,2,2.5,5,10].map(k=>k*mag).find(s=>s>=raw);top=step*Math.ceil(mx*1.05/step);}
  const valOf=d=>UP?upc[dd.indexOf(d)].reduce((s,k)=>s+k,0):(sel.size?(VIEWS[d]?rows.reduce((s,c)=>s+f(d,c),0):null):f(d,null));
  const band=(W-L-R)/N,x=i=>L+band*(i+.5),y=v=>T+(Hc-T)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${Ht}" id="svg"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ea6ff" stop-opacity=".22"/><stop offset="1" stop-color="#3ea6ff" stop-opacity=".03"/></linearGradient><g id="shorts"><rect x="-6" y="-11" width="12" height="22" rx="6" transform="rotate(30)" fill="#d9d9d9"/><path d="M-2.6,-4.2 L4,0 L-2.6,4.2Z" fill="#181818"/></g></defs>`;
  for(let v=0;v<=top+(UP?0:1);v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v?'var(--grid)':'#777'}"/><text class="tick" x="${W-R+12}" y="${y(v)+5}">${fmt(v)}</text>`;
  const pend=dd.findIndex(d=>d>D.last_day);
  if(pend>=0&&!UP)s+=`<rect x="${x(pend)-band/2}" y="${T}" width="${W-R-(x(pend)-band/2)}" height="${Hc-T}" fill="#ffffff08"/>`+(W<600?'':`<text class="tick" x="${(x(pend)-band/2+W-R)/2}" y="${T+16}" text-anchor="middle" font-size="11">views not in yet</text>`);
  lines.forEach(l=>{
    const pts=l.v.map((v,i)=>v===null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;
    const c=l.c?col(l.c):'var(--accent)';
    if(!l.c)s+=`<path d="M${pts[0][0]},${y(0)} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${y(0)}Z" fill="url(#g)"/>`;
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${l.c?2.5:3}" stroke-linejoin="round"/>`;
    if(N<=31)pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${N<=10?4:2.5}" fill="${c}"/>`);
  });
  // uploads tab: bars per day, stacked by channel colour
  if(UP)dd.forEach((d,i)=>{let acc=0;const bw=Math.max(3,Math.min(28,band*.62));
    rows.forEach((c,r)=>{const k=upc[i][r];if(!k)return;
      s+=`<rect x="${x(i)-bw/2}" y="${y(acc+k)}" width="${bw}" height="${y(acc)-y(acc+k)-1}" rx="2" fill="${col(c)}"/>`;acc+=k;});});
  if(metric==='avg'&&!sel.size&&D.goal_day<=top)s+=`<line x1="${L}" x2="${W-R}" y1="${y(D.goal_day)}" y2="${y(D.goal_day)}" stroke="#8fd14a" stroke-dasharray="6 5"/>`;
  // upload markers, like Studio: one Shorts icon under each day with an upload, a count when there were several
  const sc=Math.max(.6,Math.min(1.2,band/22));
  if(!UP)dd.forEach((d,i)=>{const k=(UPS[d]||[]).filter(u=>rows.includes(u.channel)).length;if(!k)return;
    s+=`<g transform="translate(${x(i)},${stripTop+13}) scale(${sc})"><use href="#shorts"/></g>`;
    if(k>1)s+=`<text x="${x(i)+9*sc+1}" y="${stripTop+6}" fill="#f1f1f1" font-size="${W<600?9:11}" font-weight="700">${k}</text>`;});
  // axis
  const every=Math.max(1,Math.ceil(N/(W<600?4:8)));
  s+=`<line x1="${L}" x2="${W-R}" y1="${axisY}" y2="${axisY}" stroke="#555"/>`;
  dd.forEach((d,i)=>{if((N-1-i)%every===0)s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${axisY}" y2="${axisY+5}" stroke="#555"/><text class="tick" x="${x(i)}" y="${axisY+22}" text-anchor="middle">${dlab(d)}</text>`;});
  s+=`<line id="guide" y1="${T}" y2="${axisY}" stroke="#888" visibility="hidden"/>`;
  dd.forEach((d,i)=>s+=`<rect class="hit" data-i="${i}" x="${x(i)-band/2}" y="${T}" width="${band}" height="${axisY-T}" fill="transparent"/>`);
  document.getElementById('chart').innerHTML=s+'</svg>';
  const svg=document.getElementById('svg'),tip=document.getElementById('tip'),guide=document.getElementById('guide');
  const lastData=[...dd].reverse().find(d=>VIEWS[d]);
  if(pinned===null||!dd.includes(pinned))pinned=lastData||dd[N-1];
  function show(i){
    const d=dd[i],v=valOf(d),u=(UPS[d]||[]).filter(u=>rows.includes(u.channel)),r=svg.getBoundingClientRect(),k=r.width/W,cw=document.getElementById('cw').getBoundingClientRect();
    guide.setAttribute('x1',x(i));guide.setAttribute('x2',x(i));guide.setAttribute('visibility','visible');
    const sub=UP?(u.length?u.map(x=>esc(x.channel)).join(', '):'no uploads'):`${v===null?'views not in yet · ':''}${u.length} upload${u.length===1?'':'s'}${u.length?': '+u.map(x=>esc(x.channel)).join(', '):''}`;
    tip.innerHTML=`<div class="d">${dlab(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div><div class="s" style="margin:0">${MLAB[metric]}</div><div class="n">${v===null?'—':UP?v:full(v)}</div><div class="s">${sub}</div>`;
    tip.style.display='block';
    let px=r.left-cw.left+x(i)*k;const half=tip.offsetWidth/2;px=Math.min(Math.max(px,half+4),cw.width-half-4);
    const py=r.top-cw.top+(v===null?T+30:y(v))*k;const below=py-tip.offsetHeight-14<0;
    tip.style.left=px+'px';tip.style.top=(below?py+14:py-14)+'px';tip.style.transform=below?'translate(-50%,0)':'translate(-50%,-100%)';
  }
  svg.querySelectorAll('.hit').forEach(el=>{const i=+el.dataset.i;
    el.onmouseenter=()=>{show(i);detail(dd[i]);};el.onclick=()=>{pinned=dd[i];show(i);detail(dd[i]);};});
  svg.onmouseleave=()=>{show(dd.indexOf(pinned));detail(pinned);};
  show(dd.indexOf(pinned));detail(pinned);
}

function detail(d){
  const v=VIEWS[d],p=VIEWS[add(d,-1)];
  document.getElementById('dayTitle').textContent=dlab(d,{weekday:'long',day:'numeric',month:'long'})+(v?` · ${full(v.total)} views`:' · views not in yet');
  document.getElementById('chTbl').innerHTML=v?Object.entries(v.channels).sort((a,b)=>b[1]-a[1]).map(([n,x])=>{
    let c='';if(p){const z=x-p.channels[n];c=` <span class="${z>=0?'up':'down'}">${z>=0?'▲':'▼'} ${fmt(Math.abs(z))}</span>`;}
    return `<tr><td><span class="dot" style="background:${col(n)}"></span>${esc(n)}<div class="bar" style="width:${v.total?Math.max(1,x/v.total*100):0}%;background:${col(n)}"></div></td><td class="r">${fmt(x)}${c}</td></tr>`;}).join(''):'<tr><td class="empty">YouTube Analytics hasn\'t reported this day yet. It usually lands within 2–3 days.</td></tr>';
  const u=UPS[d]||[],missing=CH.filter(c=>!u.some(x=>x.channel===c));
  document.getElementById('upList').innerHTML=(u.length?`<table>${u.map(x=>`<tr><td><span class="dot" style="background:${col(x.channel)}"></span><a href="https://youtube.com/shorts/${x.id}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="meta">${esc(x.channel)} · ${x.time}</div></td><td class="r">${fmt(x.views)}<div class="meta">views so far</div></td></tr>`).join('')}</table>`:'<div class="empty">No uploads.</div>')+(d<D.today&&missing.length&&u.length?`<div class="meta" style="margin-top:8px">No upload: ${missing.map(esc).join(', ')}</div>`:'');
  const t=v&&v.top||[];
  document.getElementById('topList').innerHTML=t.length?`<table>${t.map(x=>`<tr><td><span class="dot" style="background:${col(x.channel)}"></span><a href="https://youtube.com/shorts/${x.id}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="meta">${esc(x.channel)}</div></td><td class="r">${fmt(x.views)}</td></tr>`).join('')}</table>`:'<div class="empty">Not in yet.</div>';
}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150);});
if(D.days.length)draw();else document.getElementById('chart').innerHTML='<p class="hint">No data yet.</p>';
</script></body></html>
